general {
    lock_cmd = pidof hyprlock || hyprlock       # Bloqueo si no está ya corriendo
    before_sleep_cmd = loginctl lock-session    # Bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # Encender pantalla al despertar
}

# Advertencia de brillo a los 2.5 minutos (bajar brillo para avisar)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# Bloquear pantalla a los 5 minutos
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Apagar pantalla a los 10 minutos
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspender equipo a los 20 minutos de inactividad
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
