# ============================================================
# Modus Vivendi Palette for Hyprland (WCAG AAA OLED Dark)
# https://protesilaos.com/emacs/modus-themes
# ============================================================

# Dark Backgrounds (Pure Pitch Black to Elevated Surfaces)
$bg0           = rgb(000000)
$bg1           = rgb(1e1e1e)
$bg2           = rgb(282828)
$bg3           = rgb(383838)
$bg4           = rgb(535353)

# Foreground & Texts (High Contrast White & Grays)
$fg            = rgb(ffffff)
$fg0           = rgb(ffffff)
$fg2           = rgb(e0e0e0)
$fg3           = rgb(c6daff)
$fg4           = rgb(989898)

# Modus Vivendi Accents
$red           = rgb(ff5f59)
$bright_red    = rgb(ff6b55)
$green         = rgb(44bc44)
$bright_green  = rgb(70e070)
$yellow        = rgb(cabf00)
$bright_yellow = rgb(ffa00f)
$blue          = rgb(2fafff)
$bright_blue   = rgb(79a8ff)
$purple        = rgb(feacd0)
$bright_purple = rgb(f78fe7)
$aqua          = rgb(00d3d0)
$bright_aqua   = rgb(00bcff)
$cyan          = rgb(00d3d0)
$bright_cyan   = rgb(00bcff)
$orange        = rgb(ea8a00)
$bright_orange = rgb(ffa00f)
$gray          = rgb(989898)

# Integration Mappings with Hyprland & Waybar
$primary       = $blue
$secondary     = $cyan
$surface       = $bg0
$outline       = $bg2
