# ============================================================
# Hyprlock Configuration
# ============================================================

background {
    monitor =
    path = screenshot # Usa una captura desenfocada de la pantalla actual
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

auth {
    fingerprint {
        enabled = true
        ready_message = Escanea tu huella para desbloquear
        present_message = Verificando huella...
        retry_delay = 250
    }
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(33ccffee)
    inner_color = rgba(0, 0, 0, 0.6)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <span foreground="##aaaaaa">Contraseña o huella...</span>
    hide_input = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>Contraseña incorrecta ($ATTEMPTS)</i>
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(240, 240, 240, 0.9)
    font_size = 80
    font_family = Iosevka Term Bold
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B de %Y")"
    color = rgba(200, 200, 200, 0.75)
    font_size = 18
    font_family = Iosevka Term
    position = 0, 30
    halign = center
    valign = center
}
