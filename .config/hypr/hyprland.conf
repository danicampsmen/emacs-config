# ============================================================
# Hyprland Configuration - D. Daniel Campos Mendoza
# Lenovo Yoga 9 15IMH5 - Ubuntu 26.04 (Wayland)
# ============================================================

# Paleta de colores dinámicos (Material You generado por Matugen)
source = ~/.config/hypr/colors.conf

# ------------------------------------------------------------
# 1. Monitores (4K UHD 3840x2160 con escalado 1.5x HiDPI)
# ------------------------------------------------------------
monitor=eDP-1,3840x2160@60,0x0,1.5

# ------------------------------------------------------------
# 2. Variables de Entorno (Intel UHD Primaria + NVIDIA Offload)
# ------------------------------------------------------------
# Forzar a Hyprland a iniciar sobre la gráfica Intel UHD primaria (card2) y NVIDIA secundaria (card1)
# IMPORTANTE: Aquamarine usa ':' como separador en AQ_DRM_DEVICES, por lo que NO se deben usar rutas con ':' (como pci-...:..:..)
env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORMTHEME,gtk3
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ------------------------------------------------------------
# 3. Programas por Defecto
# ------------------------------------------------------------
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun
$browser = firefox
$editor = emacsclient -c -a emacs

# ------------------------------------------------------------
# 4. Autostart (Servicios y demonios esenciales)
# ------------------------------------------------------------
# Integración con DBus y Systemd para xdg-desktop-portal (captura, compartir pantalla y diálogos)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME

# Agente de autenticación Polkit oficial de Hyprland
exec-once = /usr/libexec/hyprpolkitagent || hyprpolkitagent

# Barra de estado y notificaciones (SwayNC para Centro de Control con historial, fallback a mako)
exec-once = waybar
exec-once = command -v swaync >/dev/null 2>&1 && swaync || mako
# volume-osd.service se gestiona de forma persistente a través de systemd --user

# Reposo y fondos
exec-once = hypridle
exec-once = hyprpaper

# Historial del portapapeles
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Montaje automático de USBs con icono en bandeja
exec-once = udiskie --tray

# Luz nocturna (Filtro azul automático Lima: -12.04, -77.04)
exec-once = ~/.config/hypr/scripts/nightlight.sh --auto

# Auto-rotación en modo tablet/tienda para Lenovo Yoga 9
exec-once = ~/.config/hypr/scripts/auto-rotate.sh

# Applets de bandeja de sistema
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Sincronización de carpetas (FolderSync Desktop con registro garantizado en Tray de Waybar)
exec-once = /home/fayfer/.local/bin/foldersync-launcher


# ------------------------------------------------------------
# 5. Entrada (Teclado y Touchpad para Lenovo Yoga 9)
# ------------------------------------------------------------
input {
    kb_layout = us,es,latam
    kb_variant = altgr-intl,,
    kb_options = caps:escape,grp:win_space_toggle,lv3:ralt_switch,compose:ralt
    repeat_delay = 300
    repeat_rate = 30

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        drag_lock = false
        clickfinger_behavior = true
        disable_while_typing = true
        scroll_factor = 1.0
    }

    sensitivity = 0 # -1.0 a 1.0 (0 = sin aceleración forzada)
}

# Gestos multitáctiles en touchpad (1:1 fluidos)
gesture = 3, horizontal, workspace

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
}

# ------------------------------------------------------------
# 6. Apariencia y Estilo
# ------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $primary $secondary 45deg
    col.inactive_border = $outline
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = workspaces, 1, 4.5, easeInOutCubic, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_hyprland_guiutils_check = true
    vfr = false # Desactivado para evitar micro-congelamientos en apps Qt/Wayland
}

# ------------------------------------------------------------
# 7. Reglas de Ventanas
# ------------------------------------------------------------
windowrule = suppress_event maximize, match:class .*
windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(blueman-manager)$
windowrule = float 1, match:class ^(nm-connection-editor)$
windowrule = float 1, center 1, size 1100 750, match:class ^(dk-tacit-desktop-foldersync-MainKt)$
windowrule = float 1, center 1, size 70% 60%, match:title ^(scratchpad)$

# GNOME Calendar (Ventana emergente flotante para Waybar)
windowrule {
    name = gnome-calendar
    match:class = ^(org\.gnome\.Calendar)$
    float = 1
    center = 1
    size = 1000 700
}

windowrule {
    name = gnome-calendar-popup
    match:class = ^(com\.gnome\.CalendarPopup)$
    float = 1
    size = 780 540
    move = 890 44
    pin = 1
}

# Nautilus (diálogos flotantes de operaciones y propiedades)
windowrule {
    name = nautilus-dialogs
    match:class = ^(org\.gnome\.Nautilus)$
    match:title = ^(Propiedades|Properties|Operaciones de archivos|File Operations).*$
    float = 1
    center = 1
}

# Inkscape Math Pad (Gilles Castel workflow)
windowrule {
    name = inkscape-math-pad
    match:title = ^(Math Pad - Inkscape)$
    float = 1
    center = 1
    size = 950 180
}



# ------------------------------------------------------------
# Espacios de trabajo temáticos (Directivas de Aplicaciones 1 al 6)
# ------------------------------------------------------------

# WS 1: Term / Sistema / Archivos (Nautilus, utilidades)
# (Nota: Kitty se mantiene flexible para abrirse en cualquier espacio donde se invoque)
windowrule = workspace 1, match:class ^(org\.gnome\.Nautilus)$
windowrule = workspace 1, match:class ^(org\.gnome\.baobab|org\.gnome\.DiskUtility)$

# WS 2: Code / Desarrollo (Emacs, Antigravity IDE, VS Code, JetBrains)
windowrule = workspace 2, match:class ^(emacs|Emacs)$
windowrule = workspace 2, match:class ^(antigravity-ide)$
windowrule = workspace 2, match:class ^(Code|code-url-handler)$
windowrule = workspace 2, match:class ^(jetbrains-.*)$
windowrule = workspace 2, match:class ^(nvim-qt)$

# WS 3: Doc / Lectura & Apuntes (Zathura, Okular, LibreOffice, Zotero, Evince, Papers, Obsidian)
windowrule = workspace 3, match:class ^(org\.pwmt\.zathura.*)$
windowrule = workspace 3, match:class ^(okular_okular|org\.kde\.okular)$
windowrule = workspace 3, match:class ^(libreoffice.*|soffice\.bin)$
windowrule = workspace 3, match:class ^(zotero)$
windowrule = workspace 3, match:class ^(org\.gnome\.Evince|org\.gnome\.Papers)$
windowrule = workspace 3, match:class ^(obsidian|Obsidian)$

# WS 4: Web / Navegación General (Firefox, Chrome, Chromium, Tor)
windowrule = workspace 4, match:class ^(firefox.*)$
windowrule = workspace 4, match:class ^(google-chrome|Google-chrome|com\.google\.Chrome|chromium)$
windowrule = workspace 4, match:class ^(tor-browser|torbrowser-launcher)$

# WS 5: Chat & Comunicación (WhatsApp Web/PWA, Discord, Telegram, Zoom, Thunderbird, Slack)
windowrule = workspace 5, match:class ^(discord|WebCord|vesktop)$
windowrule = workspace 5, match:class ^(org\.telegram\.desktop)$
windowrule = workspace 5, match:class ^(zoom|Zoom)$
windowrule = workspace 5, match:class ^(thunderbird|Thunderbird)$
windowrule = workspace 5, match:class ^(Slack|slack)$
windowrule = workspace 5, match:class ^(FFPWA-.*)$, match:title ^(.*(WhatsApp|Telegram|Discord|Slack|Messenger).*)$

# WS 6: Media & Música (Spotify nativo y Web/PWA, VLC, MPV, reproductores de audio/video)
windowrule = workspace 6, match:class ^(Spotify|spotify)$
windowrule = workspace 6, match:class ^(FFPWA-.*)$, match:title ^(.*(Spotify|YouTube Music|Deezer|Tidal|SoundCloud).*)$
windowrule = workspace 6, match:class ^(vlc|mpv|audacious|rhythmbox|cider)$

# Reglas de capa (Blur para Rofi, Wofi y Waybar)
layerrule = blur 1, match:namespace ^(rofi)$
layerrule = ignore_alpha 0.5, match:namespace ^(rofi)$
layerrule = blur 1, match:namespace ^(wofi)$
layerrule = ignore_alpha 0.5, match:namespace ^(wofi)$


# ------------------------------------------------------------
# 8. Atajos de Teclado (Vim style + utilidades)
# ------------------------------------------------------------
$mainMod = SUPER

# Lanzadores principales
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $editor
bind = $mainMod SHIFT, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, D, exec, $menu
# Conmutador de Ventanas (Super+Tab) y Vista Panorámica (Alt+Tab)
bind = $mainMod, Tab, exec, rofi -show window
bind = ALT, Tab, exec, ~/.config/hypr/scripts/toggle-expo.sh
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, S, togglesplit, # dwindle

# Lanzador de Math Pad para Inkscape (Castel workflow)
bind = ALT, M, exec, ~/.local/bin/inkscape-math-pad

# Historial de Portapapeles (cliphist + rofi)
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "Portapapeles" | cliphist decode | wl-copy

# Selector de color oficial (hyprpicker: copia hex al portapapeles y notifica)
bind = $mainMod SHIFT, P, exec, hyprpicker -a -n

# Perfiles de Audio Dolby Atmos (Selector y ciclado rápido)
bind = $mainMod, A, exec, ~/.config/hypr/scripts/audio-profile.sh
bind = $mainMod ALT, A, exec, ~/.config/hypr/scripts/audio-profile.sh --next

# Perfiles de Brillo de Pantalla y Modo Nocturno
bind = $mainMod, O, exec, ~/.config/hypr/scripts/brightness-profile.sh
bind = $mainMod, N, exec, ~/.config/hypr/scripts/nightlight.sh --menu
bind = $mainMod ALT, N, exec, ~/.config/hypr/scripts/nightlight.sh --toggle

# Centro de Control y Notificaciones con historial (estilo HyprPanel / macOS)
bind = $mainMod, C, exec, swaync-client -t -sw
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw

# Selector de Fondo dinámico (Material You) y Gestor de Apariencia
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod, U, exec, nwg-look

# Bloqueo de pantalla manual y menú de energía (Super+Alt+L para no colisionar con Vim 'l')
bind = $mainMod ALT, L, exec, hyprlock
bind = $mainMod, Escape, exec, wlogout -b 5 -T 450 -B 450 -L 150 -R 150

# Movimiento de foco (Estilo Vim)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Mover ventanas activas (Estilo Vim)
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Espacios de trabajo 1 al 10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventana activa a espacio de trabajo 1 al 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Navegación secuencial y dinámica de escritorios
bind = $mainMod, right, workspace, e+1
bind = $mainMod, left, workspace, e-1
bind = $mainMod, bracketright, workspace, e+1
bind = $mainMod, bracketleft, workspace, e-1
bind = $mainMod CTRL, right, workspace, +1
bind = $mainMod CTRL, left, workspace, -1
bind = $mainMod CTRL, l, workspace, +1
bind = $mainMod CTRL, h, workspace, -1

# Mover ventana activa al siguiente/anterior escritorio
bind = $mainMod SHIFT, right, movetoworkspace, e+1
bind = $mainMod SHIFT, left, movetoworkspace, e-1
bind = $mainMod SHIFT, bracketright, movetoworkspace, e+1
bind = $mainMod SHIFT, bracketleft, movetoworkspace, e-1

# Crear / Saltar a un nuevo escritorio vacío
bind = $mainMod, backslash, workspace, empty
bind = $mainMod, BackSpace, workspace, empty
bind = $mainMod SHIFT, backslash, movetoworkspace, empty
bind = $mainMod SHIFT, BackSpace, movetoworkspace, empty

# Scratchpad (Terminal desplegable)
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# Arrastrar y redimensionar con el ratón
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Navegación de escritorios con rueda del ratón manteniendo Super
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Teclas multimedia y de hardware
# Nota: El control de volumen, mute y mic-mute es gestionado directamente por volume-osd (evdev)
# para garantizar pasos de 2% exactos, 0ms de retardo al soltar y eliminación total de teclas pegadas.
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 2%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 2%-

# Control de reproducción multimedia (Play/Pause, Siguiente, Anterior, Parar)
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPrev, exec, playerctl previous
bindl = ,XF86AudioStop, exec, playerctl stop

# Capturas de pantalla (screenshot.sh) y grabación (wf-recorder)
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh screen
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh window
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = $mainMod ALT, R, exec, ~/.config/hypr/scripts/toggle-record.sh

# Alternar modo ahorro de batería (apaga blur y sombras en 4K)
bind = $mainMod SHIFT, B, exec, ~/.config/hypr/scripts/toggle-power-saving.sh

# ------------------------------------------------------------
# 9. Plugins Oficiales (hyprexpo: Vista en cuadrícula de escritorios)
# ------------------------------------------------------------
plugin = /home/fayfer/.config/hypr/plugins/libhyprexpo.so

plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(12141a)
        workspace_method = center current
        enable_gesture = true
        gesture_fingers = 3
        gesture_distance = 300
        gesture_positive = true
    }
}

# Overview de escritorios (Grid interactivo con Alt+Tab, Super+G o gesto táctil de 3 dedos)
bind = $mainMod, G, exec, ~/.config/hypr/scripts/toggle-expo.sh

# Submap interactivo para HyprExpo (permite salir inmediatamente con Escape o seleccionar con números)
submap = expo
bind = , Escape, exec, ~/.config/hypr/scripts/toggle-expo.sh --close
bind = , Return, exec, ~/.config/hypr/scripts/toggle-expo.sh --close
bind = ALT, Tab, exec, ~/.config/hypr/scripts/toggle-expo.sh --close
bind = $mainMod, G, exec, ~/.config/hypr/scripts/toggle-expo.sh --close
bind = $mainMod, Tab, exec, ~/.config/hypr/scripts/toggle-expo.sh --close
bind = , mouse:272, exec, hyprctl dispatch submap reset
bind = , mouse:273, exec, hyprctl dispatch submap reset

# Selección rápida con números (1-9, 0)
bind = , 1, exec, ~/.config/hypr/scripts/toggle-expo.sh --goto 1
bind = , 2, exec, ~/.config/hypr/scripts/toggle-expo.sh --goto 2
bind = , 3, exec, ~/.config/hypr/scripts/toggle-expo.sh --goto 3
bind = , 4, exec, ~/.config/hypr/scripts/toggle-expo.sh --goto 4
bind = , 5, exec, ~/.config/hypr/scripts/toggle-expo.sh --goto 5
bind = , 6, exec, ~/.config/hypr/scripts/toggle-expo.sh --goto 6
bind = , 7, exec, ~/.config/hypr/scripts/toggle-expo.sh --goto 7
bind = , 8, exec, ~/.config/hypr/scripts/toggle-expo.sh --goto 8
bind = , 9, exec, ~/.config/hypr/scripts/toggle-expo.sh --goto 9
bind = , 0, exec, ~/.config/hypr/scripts/toggle-expo.sh --goto 10
submap = reset


