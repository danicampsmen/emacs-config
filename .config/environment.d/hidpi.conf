# Entorno HiDPI para pantalla 4K (3840x2160) con Sway output scale=2.0
#
# PRINCIPIO: Sway/Wayland compositor ya aplica scale=2.0 físicamente.
# Las apps nativas Wayland reciben coordenadas lógicas (1920x1080 efectivos).
# NO deben aplicar ningún factor adicional — eso causa el doble escalado.
#
# NOTA: DISPLAY se deja sin definir para forzar Wayland nativo en apps GTK.
# Xwayland sigue disponible para apps que lo necesiten (via QT_QPA_PLATFORM=xcb).

# GTK: forzar backend Wayland (no XWayland) para que reciba la escala del compositor
GDK_BACKEND=wayland

# GTK: NO poner GDK_SCALE ni GDK_DPI_SCALE — el compositor Wayland ya escala
# (si se pone GDK_DPI_SCALE=1.13 o GDK_SCALE=2, las fuentes quedan el doble de grandes)

# Qt: usar backend Wayland nativo
QT_QPA_PLATFORM=wayland
# Qt: dejar que Wayland maneje la escala automáticamente
# Qt: NO poner QT_FONT_DPI ni QT_SCALE_FACTOR extra
QT_SCALE_FACTOR=1

# Firefox: habilitar modo Wayland nativo (mejor rendimiento y escala correcta)
MOZ_ENABLE_WAYLAND=1

# Cursor: tamaño 24px × scale 2 = 48px físicos (se ve como 24px lógicos — correcto)
XCURSOR_SIZE=24
XCURSOR_THEME=Adwaita
