# KITTY CONFIG - from FAyFER workspace (terminal-optimized)

# ———————————————————————————————————————————————————————
# Fuentes
# ———————————————————————————————————————————————————————
font_family      family="Iosevka Term"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14

# Espaciado de línea vertical (descomentar y ajustar si se requiere)
# modify_font cell_height 105%

# ———————————————————————————————————————————————————————
# Integración con Emacs y Control Remoto
# ———————————————————————————————————————————————————————
# Nota: El protocolo de teclado extendido de Kitty está activo por defecto.
# Usamos 'socket-only' por seguridad para evitar inyección desde la TTY.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty.sock
shell_integration enabled

# Historial de scrollback
scrollback_lines 20000

# Control de portapapeles
clipboard_control write-clipboard write-primary read-clipboard read-primary
copy_on_select    no

# Rendimiento y cursor
cursor_shape          block
cursor_blink_interval 0
repaint_delay         6
input_delay           1
sync_to_monitor       yes
enable_audio_bell     no

# ———————————————————————————————————————————————————————
# Colores (Modus Vivendi Oficial - WCAG AAA OLED Dark)
# ———————————————————————————————————————————————————————
foreground              #ffffff
background              #000000
selection_foreground    #ffffff
selection_background    #282828

# Cursor
cursor                  #ffffff
cursor_text_color       #000000

# URL underline
url_color               #2fafff

# Paleta ANSI (16 colores)
# black
color0  #000000
color8  #535353

# red
color1  #ff5f59
color9  #ff6b55

# green
color2  #44bc44
color10 #70e070

# yellow
color3  #cabf00
color11 #ffa00f

# blue
color4  #2fafff
color12 #79a8ff

# magenta
color5  #feacd0
color13 #f78fe7

# cyan
color6  #00d3d0
color14 #00bcff

# white
color7  #bfbfbf
color15 #ffffff

# Decoración de ventanas
window_padding_width    2
window_border_width     1pt
active_border_color     #2fafff
inactive_border_color   #282828
bell_border_color       #ffa00f
hide_window_decorations no

# ———————————————————————————————————————————————————————
# Barra de Pestañas (Tab Bar)
# ———————————————————————————————————————————————————————
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_max_length 30
tab_bar_min_tabs 0

# Usamos split('/')[-1] para mostrar solo la carpeta actual en lugar de la ruta absoluta entera
tab_title_template        "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{tab.active_exe} ─ {title}{fmt.fg.tab}  ({tab.active_wd.split('/')[-1]})"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{fmt.bold}{tab.active_exe}{fmt.nobold} ─ {title}{fmt.fg.tab}  ({tab.active_wd.split('/')[-1]})"

# Colores de pestañas
active_tab_foreground   #000000
active_tab_background   #2fafff
active_tab_font_style   bold
inactive_tab_foreground #bfbfbf
inactive_tab_background #1e1e1e
tab_bar_background      #000000
tab_bar_margin_color    #000000

# ———————————————————————————————————————————————————————
# Atajos de Teclado (Key Mappings)
# ———————————————————————————————————————————————————————
# Acciones con el buffer de comandos
map ctrl+shift+alt+g show_first_command_output_on_screen

# Documentación y paleta de comandos (mantiene a salvo ctrl+shift+p para los hints)
map ctrl+shift+f1 show_kitty_doc actions
map ctrl+shift+f3 command_palette

# Navegación y creación de ventanas/tabs heredando el directorio actual
map ctrl+alt+enter launch --type=window --cwd=current
map ctrl+alt+t     launch --type=tab --cwd=current
map ctrl+shift+f   toggle_fullscreen

# Control de tamaño de fuente (corregido a la sintaxis oficial)
map ctrl+plus        change_font_size all +1.0
map ctrl+equal       change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           change_font_size all 0
