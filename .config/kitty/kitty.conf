# KITTY CONFIG - from FAyFER workspace (terminal-optimized)

font_family      family="Iosevka Term" style="Light"
bold_font        family="Iosevka Term" style="Bold"
italic_font      family="Iosevka Term" style="Italic"
bold_italic_font family="Iosevka Term" style="Bold Italic"
font_size        12.5

# Adjust line height; keep to values supported by kitty (no units)
line_spacing 0.05

# Symbols / Nerd Fonts mapping - keep if your font supports these glyphs
# symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7,U+E030-U+E033,U+E040-U+E043,U+E050-U+E053,U+E060-U+E063,U+F000-U+F2E0 Symbols Nerd Font Mono

# Extended keyboard protocol for Emacs
extended_keyboard yes

# Remote control socket for emacs integration
allow_remote_control yes
listen_on unix:/tmp/kitty-emacs
shell_integration enabled

# Clipboard control
clipboard_control write-clipboard write-primary read-clipboard read-primary
copy_on_select    no

# Performance and cursor
cursor_shape          block
cursor_blink_interval 0
repaint_delay         6
input_delay           1
sync_to_monitor       yes
enable_audio_bell     no

# Colors (Modus Vivendi inspired)
background            #000000
foreground            #ffffff
cursor                #f0c674
cursor_text_color     #000000
selection_background  #3a3f58
selection_foreground  #ffffff

# Palette
color0  #1e1e1e
color1  #ff6c6b
color2  #98be65
color3  #da8548
color4  #51afef
color5  #c678dd
color6  #5699af
color7  #abb2bf

color8  #5c6370
color9  #ff6655
color10 #7bc275
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #46d9ff
color15 #dfdfdf

# Window decorations
window_padding_width  2
window_border_width   1
active_border_color   #51afef
inactive_border_color #1e1e1e
hide_window_decorations yes

# Key mappings for common clipboard and window actions
# (These are convenient with Wayland + Emacs TUI)
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab

# Make sure kitty accepts OSC52 and supports remote control usage from Emacs
# (Emacs packages like clipetty use terminal OSC or remote-control socket.)
# The socket is already set via listen_on above.
